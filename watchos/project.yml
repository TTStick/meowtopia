# 猫窝手表版：独立的 watchOS App（不需要 iPhone），和 iPhone App 附带的手表 App 可以同时存在。
#   cd watchos && ~/bin/xcodegen generate && open CatNestWatchSolo.xcodeproj
# 和附带的手表 App 共用几份基础代码（ios/App/CatNestWatch/ 里的 API、钥匙串、配置、猫的动画）。
name: CatNestWatchSolo
options:
  bundleIdPrefix: com.catnest
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
# (this XcodeGen install has no setting presets, so the usual defaults are spelled out)
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      VALIDATE_PRODUCT: YES
configs:
  Debug: debug
  Release: release
targets:
  CatNestWatchSolo:
    type: application
    platform: watchOS
    sources:
      - path: CatNestWatchSolo
      - path: ../ios/App/CatNestWatch/API.swift
        group: Shared
      - path: ../ios/App/CatNestWatch/Keychain.swift
        group: Shared
      - path: ../ios/App/CatNestWatch/Config.swift
        group: Shared
      - path: ../ios/App/CatNestWatch/CatView.swift
        group: Shared
      - path: ../ios/App/CatNestWatch/Debug.swift
        group: Shared
      - path: Shared
    dependencies:
      - target: CatNestWatchSoloWidgets
    entitlements:
      path: CatNestWatchSolo/CatNestWatchSolo.entitlements
      properties:
        com.apple.security.application-groups: [group.com.catnest.watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catnest.watch
        PRODUCT_NAME: CatNestWatchSolo
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CatNestWatchSolo/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 猫窝手表版
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
  # complications and Smart Stack widgets (WidgetKit); they read what the app saves in the shared app group
  CatNestWatchSoloWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: CatNestWatchSoloWidgets
      - path: Shared
    entitlements:
      path: CatNestWatchSoloWidgets/CatNestWatchSoloWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.catnest.watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catnest.watch.widgets
        PRODUCT_NAME: CatNestWatchSoloWidgets
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CatNestWatchSoloWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 猫窝
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
